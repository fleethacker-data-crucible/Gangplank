name: Keystone PowerShell checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Offline PowerShell 5.1 validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\SmartSave.Tests.ps1
          & .\tests\Workspace.Tests.ps1
